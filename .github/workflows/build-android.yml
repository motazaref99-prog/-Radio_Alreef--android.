name: Build Radio Alreef APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Radio_Alreef_Android_Prototype_v0.5_SectionIdentity.zip'
      - '.github/workflows/build-android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          mkdir -p project
          unzip -q Radio_Alreef_Android_Prototype_v0.5_SectionIdentity.zip -d project

      - name: Align Java and Kotlin JVM targets
        shell: bash
        run: |
          APP_GRADLE="project/radio_alreef_android/app/build.gradle.kts"
          test -f "$APP_GRADLE"
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("project/radio_alreef_android/app/build.gradle.kts")
          s = p.read_text()
          s = re.sub(r'(sourceCompatibility\\s*=\\s*JavaVersion\\.)VERSION_1_8', r'\\1VERSION_17', s)
          s = re.sub(r'(targetCompatibility\\s*=\\s*JavaVersion\\.)VERSION_1_8', r'\\1VERSION_17', s)
          s = re.sub(r'(jvmTarget\\s*=\\s*)["\\']1\\.8["\\']', r'\\1"17"', s)

          if "sourceCompatibility" not in s or "targetCompatibility" not in s:
              block = '''
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              '''
              m = re.search(r'android\\s*\\{', s)
              if not m:
                  raise SystemExit("Could not find android block")
              s = s[:m.end()] + block + s[m.end():]

          p.write_text(s)
          print("Updated app/build.gradle.kts for Java 17.")
          PY
          echo "---- JVM settings after patch ----"
          grep -nE 'sourceCompatibility|targetCompatibility|jvmTarget' "$APP_GRADLE" || true
          gradle -p project/radio_alreef_android assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Radio-Alreef-APK
          path: project/radio_alreef_android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
