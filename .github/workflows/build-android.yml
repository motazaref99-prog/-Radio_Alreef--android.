
name: Build Radio Alreef APK

on:
  workflow_dispatch:
  push:
    paths:
      - '3Radio_Alreef_Android_Prototype_v0.5_SectionIdentity_CORRECTED.zip.zip'
      - '.github/workflows/build-android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          mkdir -p project
          unzip -q 3Radio_Alreef_Android_Prototype_v0.5_SectionIdentity_CORRECTED.zip -d project

      - name: Fix JVM targets and build APK
        shell: bash
        run: |
          APP_GRADLE="project/radio_alreef_android/app/build.gradle.kts"
          test -f "$APP_GRADLE"

          python3 - "$APP_GRADLE" <<'PY'
          import sys
          import re
          from pathlib import Path

          p = Path(sys.argv[1])
          s = p.read_text()

          block = """
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          """

          if re.search(r'compileOptions\s*\{', s):
              s = re.sub(
                  r'compileOptions\s*\{.*?\}',
                  block.strip(),
                  s,
                  count=1,
                  flags=re.S
              )
          else:
              m = re.search(r'android\s*\{', s)
              if not m:
                  raise SystemExit("Android block not found")
              s = s[:m.end()] + "\n" + block + s[m.end():]

          s = re.sub(
              r'jvmTarget\s*=\s*["\']1\.8["\']',
              'jvmTarget = "17"',
              s
          )

          p.write_text(s)
          print("JVM target configuration updated.")
          PY

          gradle -p project/radio_alreef_android assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Radio-Alreef-APK
          path: project/radio_alreef_android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
