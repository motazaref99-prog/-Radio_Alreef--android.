name: Build Radio Alreef APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Radio_Alreef_Android_Prototype_v0.5_SectionIdentity.zip'
      - '.github/workflows/build-android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          mkdir project
          unzip -q Radio_Alreef_Android_Prototype_v0.5_SectionIdentity.zip -d project

      - name: Build Android APK
        run: |
         sed -i 's/VERSION_1_8/VERSION_17/g' project/radio_alreef_android/app/build.gradle.kts
          gradle -p project/radio_alreef_android assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Radio-Alreef-APK
          path: project/radio_alreef_android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
